name: Flutter Build

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
      
      - name: Get Client dependencies
        run: |
          cd Update-jundullah/Client_panel/client_side
          flutter pub get
      
      - name: Build Client APK
        run: |
          cd Update-jundullah/Client_panel/client_side
          flutter build apk --release --no-tree-shake-icons
      
      - name: Get Admin dependencies
        run: |
          cd Update-jundullah/Client_panel/Admin_panel
          flutter pub get
      
      - name: Build Admin APK
        run: |
          cd Update-jundullah/Client_panel/Admin_panel
          flutter build apk --release --no-tree-shake-icons
      
      - name: Upload APKs
        uses: actions/upload-artifact@v3
        with:
          name: flutter-apks
          path: |
            Update-jundullah/Client_panel/client_side/build/app/outputs/apk/release/
            Update-jundullah/Client_panel/Admin_panel/build/app/outputs/apk/release/
      
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          body: |
            APK builds for this release are available in the Artifacts section.
          draft: false
          prerelease: false
