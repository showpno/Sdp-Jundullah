name: Flutter Build APKs

on:
  push:
    branches: [ main, develop, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
      
      - name: Cache Flutter dependencies
        uses: actions/cache@v3
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      - name: Get dependencies for Client
        run: |
          cd Client_panel/client_side
          flutter clean
          flutter pub get
      
      - name: Build Client APK (Release)
        run: |
          cd Client_panel/client_side
          flutter build apk --release --no-tree-shake-icons
      
      - name: Get dependencies for Admin
        run: |
          cd Client_panel/Admin_panel
          flutter clean
          flutter pub get
      
      - name: Build Admin APK (Release)
        run: |
          cd Client_panel/Admin_panel
          flutter build apk --release --no-tree-shake-icons
      
      - name: Upload APKs to Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: flutter-apks
          path: |
            Client_panel/client_side/build/app/outputs/apk/release/app-release.apk
            Client_panel/Admin_panel/build/app/outputs/apk/release/app-release.apk
          retention-days: 30
      
      - name: List build outputs
        if: always()
        run: |
          echo "=== Client_side outputs ==="
          find Client_panel/client_side/build/app/outputs -type f -name "*.apk" || echo "No APKs found"
          echo "=== Admin_panel outputs ==="
          find Client_panel/Admin_panel/build/app/outputs -type f -name "*.apk" || echo "No APKs found"
